name: Post Daily News

on:
  schedule:
    - cron: "55 22 * * *"  # 07:55 JST
    - cron: "0 9 * * *"  # 18:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-news-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || '1290456657653928048' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main

      - name: Commit state
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted_links.json state/pending_reads.json
          git diff --cached --quiet || git commit -m "chore(state): update news state [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            git rebase --abort 2>/dev/null || true
            echo "::warning::State push attempt $attempt/3 failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push state after 3 attempts; posted URLs may be reposted next run. Recover state manually."
          exit 1
